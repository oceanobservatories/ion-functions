name: Deploy docs preview to GitHub Pages

on:
  push:
    branches:
      - documentation
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check docs are ASCII
        run: |
          if grep -nP '[^\x00-\x7F]' README.md mkdocs.yml $(git ls-files 'docs/*.md'); then
            echo "Non-ASCII characters found (listed above); use ASCII or HTML entities instead."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install .[docs]

      - name: Set fork site_url
        run: |
          sed -i "s|site_url:.*|site_url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/|" mkdocs.yml

      - name: Deploy
        run: mkdocs gh-deploy --force

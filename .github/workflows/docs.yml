name: Deploy docs to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check docs are ASCII
        run: |
          if grep -nP '[^\x00-\x7F]' README.md mkdocs.yml $(git ls-files 'docs/*.md'); then
            echo "Non-ASCII characters found (listed above); use ASCII or HTML entities instead."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install .[docs]

      - name: Deploy
        run: mkdocs gh-deploy --force

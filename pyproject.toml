[build-system]
requires = ["setuptools>=77", "Cython>=3.0", "numpy>=2.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ion-functions"
dynamic = ["version"]
description = "Oceanographic data processing functions for the Ocean Observatories Initiative (OOI)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Ocean Observatories Initiative" }]
maintainers = [{ name = "OOI Software Development Group", email = "helpdesk@oceanobservatories.org" }]
keywords = ["oceanography", "OOI", "Ocean Observatories Initiative", "data processing", "seawater"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "numexpr>=2.8",
    "gsw>=3.6",
    "ppigrf>=2.1",
]

[project.optional-dependencies]
test = ["pytest", "matplotlib"]
docs = ["mkdocs", "mkdocstrings-python", "mkdocs-print-site-plugin", "playwright"]
dev = ["ion-functions[test,docs]"]

[project.urls]
Homepage = "https://oceanobservatories.org/"
Documentation = "https://oceanobservatories.github.io/ion-functions/"
Repository = "https://github.com/oceanobservatories/ion-functions"
Issues = "https://github.com/oceanobservatories/ion-functions/issues"
Changelog = "https://github.com/oceanobservatories/ion-functions/blob/master/RELEASE_NOTES.md"

[tool.setuptools.dynamic]
version = { attr = "version.__version__" }

[tool.setuptools.packages.find]
include = ["ion_functions*"]

[tool.setuptools.package-data]
"ion_functions.data" = ["*.mat", "matlab_scripts/**/*"]
"ion_functions.qc" = ["matlab_scripts/*"]

[tool.pytest.ini_options]
testpaths = ["ion_functions"]
norecursedirs = [".*", "build", "dist", "*.egg", "perf"]

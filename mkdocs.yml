site_name: Ocean Observatories Initiative Ion Functions
repo_url: https://github.com/joffreyp/ion-functions/tree/feature/documentation
repo_name: ion-functions
theme:
  name: "material"
  logo: assets/NSF-OOI-RGB.png
  features:
    - navigation.sections
    # - navigation.expand
    - navigation.path
    - navigation.instant
    - navigation.prune
    - navigation.top
    - toc.integrate
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
  icon:
    repo: fontawesome/brands/github

plugins:
  - mkdocstrings:
          handlers:
            python:
              options:
                docstring_style: numpy
  - search
  - autorefs

nav:
  - Ion Functions Overview: index.md
  - Reference:
    - ADCP Functions: adcp_functions.md
    - CTD Functions: ctd_functions.md
    - CO2 Functions: co2_functions.md
    - DOSTA Functions: do2_functions.md
    - Fluorometer Functions: flo_functions.md
    - Hydrophone Functions: hyd_functions.md
    - Optical Backscatter Functions: obs_functions.md
    - Met Functions: met_functions.md
    - Disolved Gas Concentration Functions: msp_functions.md
    - Disolved Nitrate Functions: nit_functions.md
    - Ocean Bottom Seismometer Functions: obs_functions.md
    - OPTAA Functions: opt_functions.md
    - pH Functions: ph_functions.md
    # - Polycal Functions: polycals.md # Doesn't work with MkDocs right now!
    - Seafloor Pressure Functions: prs_functions.md
    - Seafloor Hydrothermal Vent Chemistry Functions: sfl_functions.md
    - Velocity Functions: vel_functions.md
    - Surface Wave Spectra Functions: wav_functions.md
    - Utility Functions: utility_functions.md
  - QC/Testing: qc-tests.md

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

site_name: Ocean Observatories Initiative Ion Functions
repo_url: https://github.com/joffreyp/ion-functions/tree/feature/documentation
repo_name: ion-functions
theme:
  name: "material"
  logo: assets/NSF-OOI-RGB.png
  features:
    - navigation.sections
    # - navigation.expand
    - navigation.path
    - navigation.instant
    - toc.integrate
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share
  icon:
    repo: fontawesome/brands/github

plugins:
  - mkdocstrings:
          handlers:
            python:
              options:
                docstring_style: numpy
  - search

nav:
  - Ion Functions Overview: index.md
  - Reference:
    - CTD Functions: ctd_functions.md
    - CO2 Functions: co2_functions.md
  - QC/Testing: qc-tests.md

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
